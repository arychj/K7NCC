<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K7NCC</title>
<meta name="description" content="K7NCC — amateur radio station, Bellingham, WA USA.">
<link rel="icon" href="assets/img/favicon.png">

<meta property="og:title" content="K7NCC">
<meta property="og:description" content="Amateur radio station — Bellingham, WA USA.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://k7.ncc.cx/">
<meta property="og:image" content="https://k7.ncc.cx/assets/img/hamship-call.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow+Semi+Condensed:wght@400;600&family=Share+Tech+Mono&display=swap">

<style>
:root {
  --void:     #080B12;
  --hull:     #90A0A0;
  --glaze:    #C05818;
  --nacelle:  #4FC3F7;
  --text:     #C6D0D0;

  --display: "Michroma", "Eurostile", sans-serif;
  --body: "Barlow Semi Condensed", "Helvetica Neue", sans-serif;
  --data: "Share Tech Mono", "SFMono-Regular", monospace;

    --u: clamp(13px, 1.7vw, 22px);
  --inset: clamp(1rem, 3.5vw, 3rem);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse 90% 70% at 12% 88%, rgba(79, 195, 247, 0.13) 0%, transparent 62%),
    linear-gradient(163deg, #0C1220 0%, var(--void) 52%, #05070C 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.stars,
.graticule,
.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.stars {
  background-image: url("assets/img/starfield.svg");
  background-size: cover;
  background-position: center;
  opacity: 0.85;
}

.graticule {
  background-image:
    repeating-linear-gradient(to right, rgba(192, 88, 24, 0.06) 0 1px, transparent 1px 5.5rem),
    repeating-linear-gradient(to bottom, rgba(192, 88, 24, 0.06) 0 1px, transparent 1px 5.5rem);
}

.vignette {
  background:
    linear-gradient(to top, rgba(4, 6, 12, 0.88) 0%, rgba(4, 6, 12, 0.4) 18%, transparent 42%),
    radial-gradient(ellipse 82% 78% at 50% 45%, transparent 42%, rgba(3, 5, 10, 0.72) 100%);
}

.frame {
  position: fixed;
  inset: var(--inset);
  border: 2px solid transparent;
  border-image: linear-gradient(
      135deg,
      rgba(192, 88, 24, 0.92) 0%,
      rgba(192, 88, 24, 0.55) 22%,
      rgba(192, 88, 24, 0.04) 50%,
      rgba(192, 88, 24, 0.55) 78%,
      rgba(192, 88, 24, 0.92) 100%) 1;
  pointer-events: none;
}

.page {
  position: relative;
  z-index: 1;
    height: 100vh;
  height: 100svh;
  padding: calc(var(--inset) + clamp(1.6rem, 3vw, 3.25rem));
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 1.5rem;
}

.eyebrow {
  font-family: var(--display);
  font-size: clamp(0.52rem, 1.15vw, 0.78rem);
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: rgba(192, 88, 24, 0.95);
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  grid-template-rows: minmax(0, 1fr);
  gap: clamp(1rem, 4vw, 3rem);
  min-height: 0;
}

.lockup {
  grid-row: 1;
  grid-column: 1;
  align-self: end;
  justify-self: start;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: calc(var(--u) * 0.9);
}

.wordmark {
  width: min(100%, calc(var(--u) * 21));
  height: auto;
  display: block;
  filter: drop-shadow(0 0.16em 0.4em rgba(0, 0, 0, 0.85));
}

.qth {
  font-size: calc(var(--u) * 1.02);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text);
}

.contact {
  display: none;
  align-items: center;
  gap: 0.7em;
  font-family: var(--data);
  font-size: calc(var(--u) * 0.78);
  letter-spacing: 0.06em;
  color: rgba(192, 88, 24, 0.95);
  text-decoration: none;
  transition: color 140ms ease;
}

.contact.is-ready { display: inline-flex; }

.contact::before {
  content: "";
  width: 0.42em;
  height: 0.42em;
  border-radius: 50%;
  background: var(--nacelle);
  flex: none;
}

.contact .addr {
  border-bottom: 1px solid rgba(192, 88, 24, 0.32);
  padding-bottom: 0.15em;
  transition: border-color 140ms ease;
}

.contact:hover,
.contact:focus-visible { color: #E8853C; }

.contact:hover .addr,
.contact:focus-visible .addr { border-color: rgba(232, 133, 60, 0.85); }

.contact:focus-visible {
  outline: 2px solid var(--nacelle);
  outline-offset: 6px;
}

.ship {
  grid-row: 1;
  grid-column: 2;
  width: 100%;
  height: auto;
  max-height: 100%;
  min-height: 0;
  display: block;
  object-fit: contain;
  object-position: right top;
  filter: drop-shadow(0 0.28em 0.55em rgba(0, 0, 0, 0.62));
}

.foot {
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 1.6em;
  font-family: var(--display);
  font-size: clamp(0.45rem, 0.95vw, 0.62rem);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(144, 160, 160, 0.58);
}

.contact-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5em 2.1em;
}

.links {
  display: flex;
  align-items: center;
  gap: 1.5em;
  font-size: calc(var(--u) * 0.6);
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

.links a {
  color: rgba(144, 160, 160, 0.72);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 0.2em;
  transition: color 140ms ease, border-color 140ms ease;
}

.links a:hover,
.links a:focus-visible {
  color: var(--text);
  border-color: rgba(144, 160, 160, 0.5);
}

.links a:focus-visible {
  outline: 2px solid var(--nacelle);
  outline-offset: 5px;
}

.foot .sig {
  font-size: 1.4em;
  letter-spacing: 0.14em;
  color: rgba(192, 88, 24, 0.9);
}

@media (max-width: 720px), (orientation: portrait) and (max-width: 900px) {
  .page {
    height: auto;
    min-height: 100svh;
  }

  .hero {
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    align-content: center;
    gap: clamp(1.5rem, 6vw, 2.5rem);
  }

  .ship {
    grid-row: 1;
    grid-column: 1;
    justify-self: center;
    align-self: center;
    width: min(100%, 30rem);
    height: auto;
  object-position: center;
  }

  .lockup {
    grid-row: 2;
    grid-column: 1;
    align-self: center;
    justify-self: center;
    align-items: center;
    text-align: center;
  }

  .eyebrow,
  .foot {
    justify-content: center;
    text-align: center;
  }

  .qth { font-size: calc(var(--u) * 1.15); }

  .contact-row { justify-content: center; }
}

@media (max-height: 640px) and (min-width: 721px) {
  .page {
    padding-block: calc(var(--inset) + 0.6rem);
    gap: 0.6rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<body>
  <div class="stars"></div>
  <div class="graticule"></div>
  <div class="vignette"></div>
  <div class="frame"></div>

  <main class="page">
    <div class="eyebrow">Amateur Radio Station</div>

    <div class="hero">
      <img class="ship" src="assets/img/hamship.png"
           alt="The K7NCC hamship: a glazed ham under warp nacelles with a Yagi antenna">

      <div class="lockup">
        <img class="wordmark" src="assets/img/call.png" alt="K7NCC">
        <div class="qth">Bellingham, WA&nbsp; USA</div>
        <div class="contact-row">
          <a class="contact" data-rot="xi@k1ylw.swq" href="#"><span class="addr"></span></a>
          <nav class="links">
            <a href="https://www.qrz.com/db/K7NCC">QRZ</a>
            <a href="https://pota.app/#/profile/K7NCC">POTA</a>
          </nav>
        </div>
      </div>
    </div>

    <div class="foot">
      <span>To boldly ham</span>
      <span class="sig">73</span>
    </div>
  </main>

<script>
(function () {
  var a = document.querySelector(".contact");
  if (!a) return;
  var key = 73;
  var addr = a.dataset.rot.replace(/[a-z0-9]/g, function (c) {
    var digit = c >= "0" && c <= "9";
    var base = digit ? 48 : 97;
    var span = digit ? 10 : 26;
    var v = c.charCodeAt(0) - base;
    var out = String.fromCharCode(((v - key) % span + span) % span + base);
    key += v;
    return out;
  });
  a.href = "mailto:" + addr;
  a.querySelector(".addr").textContent = addr;
  a.classList.add("is-ready");
})();

console.log("--... ...-- / -.. . / -.- --... -. -.-. -.-.");
</script>
</body>
</html>
